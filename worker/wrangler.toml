name = "skinfix-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# @skinfix/shared lives in ../shared (no npm workspace needed).
[alias]
"@skinfix/shared" = "../shared/src/index.ts"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_TEMPERATURE = "0.2"
SCANS_PER_DAY = "20"
MOCK = "0"

# Create with: npx wrangler kv namespace create KV   (then paste the id here)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put INVITE_CODE
# Local dev reads them from .dev.vars (git-ignored).

[observability]
enabled = true
